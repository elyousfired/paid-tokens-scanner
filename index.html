<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAID Terminal — 100% Burn & Deflationary Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'arc-bg': '#070b14',
              'arc-dark': '#0b101d',
              'arc-card': '#0d1424',
              'arc-card-hover': '#111b30',
              'arc-border': '#1e293b',
              'arc-cyan': '#00f2fe',
              'arc-teal': '#06b6d4',
              'arc-emerald': '#10b981',
              'arc-orange': '#f97316',
              'arc-amber': '#f59e0b',
              'arc-rose': '#f43f5e',
              'arc-purple': '#a855f7'
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #070b14;
        color: #e2e8f0;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      /* Custom sleek scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #070b14;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38bdf8;
      }
    </style>
  </head>
  <body class="bg-[#070b14] text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
